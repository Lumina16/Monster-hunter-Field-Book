name: Android milestone checks

on:
  push:
    branches: ['arena/03086cb6-monster-hunter-field-book']
  pull_request:
    paths: ['android/**', 'data/**', 'assets/**', 'src/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-030:
    if: github.event_name == 'push' && !hashFiles('_recovery_030/DONE')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download 0.2.0 and 0.3.0-review releases and decompile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/release_020 /tmp/release_030 /tmp/jadx
          gh release download android-v0.2.0 -D /tmp/release_020
          gh release download android-v0.3.0-review -D /tmp/release_030

          # Install jadx 1.5.1
          curl -sL https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip -o /tmp/jadx.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx

          # Decompile 0.2.0 and 0.3.0 in normal mode and fallback mode
          /tmp/jadx/bin/jadx -d /tmp/jadx_020 --show-bad-code /tmp/release_020/Monster_Hunter_Field_Book_0.2.0.apk || true
          /tmp/jadx/bin/jadx -d /tmp/jadx_030 --show-bad-code /tmp/release_030/Monster_Hunter_Field_Book_0.3.0_review.apk || true
          /tmp/jadx/bin/jadx -d /tmp/jadx_030_fallback --decompilation-mode fallback /tmp/release_030/Monster_Hunter_Field_Book_0.3.0_review.apk || true

          mkdir -p _recovery_030/jadx_020 _recovery_030/jadx_030 _recovery_030/jadx_030_fallback _recovery_030/res_030
          cp -r /tmp/jadx_020/sources/com/lumina/monsterhunterfieldbook/* _recovery_030/jadx_020/
          cp -r /tmp/jadx_030/sources/com/lumina/monsterhunterfieldbook/* _recovery_030/jadx_030/
          cp -r /tmp/jadx_030_fallback/sources/com/lumina/monsterhunterfieldbook/* _recovery_030/jadx_030_fallback/
          cp -r /tmp/jadx_030/resources/AndroidManifest.xml _recovery_030/res_030/ || true
          cp -r /tmp/jadx_030/resources/res _recovery_030/res_030/ || true

          python3 android/tools/_inspect_030_apk.py
          touch _recovery_030/DONE
      - name: Commit recovered artifacts back to branch
        run: |
          git config user.name "Lumina16"
          git config user.email "ota16shiro@gmail.com"
          git add _recovery_030
          git commit -m "Temporary: extract 0.3.0-review APK decompilation and asset diff"
          git push origin HEAD:${{ github.ref_name }}
