name: Android milestone checks

on:
  push:
    branches: ['android/0.2.0-offline-libraries']
    paths: ['android/**', 'data/**', 'assets/**', 'src/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'data/**', 'assets/**', 'src/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          python -m pip install -r android/requirements.txt
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and check native Android
        working-directory: android
        run: |
          ./gradlew assembleRelease testDebugUnitTest lintDebug --stacktrace
          python tools/validate_native.py --assets app/build/generated/nativeAssets
      - name: Collect signing tool
        if: always()
        run: |
          mkdir -p android/app/build/outputs/signing-tool
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android/app/build/outputs/signing-tool/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-build-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/signing-tool/apksigner.jar
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/native-validation.json
          retention-days: 14
